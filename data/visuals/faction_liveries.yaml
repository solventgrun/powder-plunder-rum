# Faction livery palettes (Phase 1 of the Faction Livery Kits backlog entry).
# Colors are hex html; roles map onto GLB material slots via
# ShipVisualBuilder.LIVERY_MATERIAL_ROLES:
#   paint     - the ship's painted band/castle surfaces (the "ownable color")
#   accent    - secondary painted surfaces (bulwark/stern panels)
#   hull_wood - hull timber stain (NOT deck planking; class decks stay)
#   trim      - gold/gilt ornament budget
#   streamer  - masthead streamer cloth
#   sails     - canvas tint (feeds the existing sail tint path)
# Pirates read as the absence of polish (2026-08-17): tarred timber, a dark
# oxblood band, blackened iron where the nations wear gold, blood-red
# streamers, and darker canvas than any nation — the strongest silhouette cue.
# The class-brief schemes remain the fallback for records with no/unknown
# faction.
liveries:
  - id: spain
    paint: "8f1a10"
    accent: "9a641c"
    hull_wood: "31180a"
    trim: "d9a12e"
    streamer: "e3b41f"
    sails: "efe3c0"


# Duel weapons. Speed is traded against weight: a fast blade is hard for the
# opponent to read and forgives mistakes, a heavy one turns two clean hits into
# a won fight. Multipliers apply to the base timings in duel_rules.yaml, so
# tuning the global feel and tuning a single weapon stay separate knobs.
#
# These are context-free: the same table serves a boarding duel, a tavern
# brawl, or a land-battle officer fight.
duel_weapons:
  - id: cutlass
    name: Cutlass
    windup_multiplier: 0.78
    recovery_multiplier: 0.82
    damage_multiplier: 0.84
    summary: Fast and forgiving. Hard to read, light to feel.

  - id: longsword
    name: Longsword
    windup_multiplier: 1.0
    recovery_multiplier: 1.0
    damage_multiplier: 1.0
    summary: Even in every respect. The honest choice.

  - id: broadsword
    name: Broadsword
    windup_multiplier: 1.3
    recovery_multiplier: 1.22
    damage_multiplier: 1.38
    summary: Slow, telegraphed, brutal. Two clean hits change a fight.
